[package]
name = "echo"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Echo for Linux"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_1"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
x11rb = { version = "0.13.2", features = ["xkb"] }
cpal = "0.15.3"
hound = "3.5.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-native-roots"] }
